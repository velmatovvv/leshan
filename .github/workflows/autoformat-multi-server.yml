name: Autoformat multi-server branch

on:
  push:
    branches: [ "feature/lwm2m-multi-server" ]
    paths:
      - ".github/workflows/autoformat-multi-server.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/lwm2m-multi-server
          persist-credentials: true
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply project formatter and import sorter
        run: mvn -B formatter:format impsort:sort
      - name: Commit formatted sources
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Apply Maven formatter and import sorter"
            git push origin HEAD:feature/lwm2m-multi-server
          fi
